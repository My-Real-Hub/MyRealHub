<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your MyRealHub password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 32px 20px;
      background: #fafaf9;
      color: #1c1917;
      font-family: Arial, sans-serif;
    "
  >
    <div
      style="
        max-width: 520px;
        margin: 0 auto;
        padding: 32px;
        border: 1px solid #e7e5e4;
        border-radius: 12px;
        background: #ffffff;
      "
    >
      <h1 style="margin: 0 0 20px; font-size: 24px">
        Reset your MyRealHub password
      </h1>
      <p style="font-size: 16px; line-height: 1.6">
        Follow this secure link to choose a new password for your account.
      </p>
      <p style="margin: 28px 0">
        <a
          href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery"
          style="
            display: inline-block;
            padding: 14px 22px;
            border-radius: 8px;
            background: #047857;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
          "
          >Choose a new password</a
        >
      </p>
      <p style="font-size: 14px; line-height: 1.6; color: #57534e">
        If you did not request this email, you can ignore it. Your password will
        only change after you save a new one on the website.
      </p>
    </div>
  </body>
</html>
